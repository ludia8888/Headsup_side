name: Jimin
options:
  bundleIdPrefix: com.jimin.mvp
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    AUTOMATION_APPROVED: NO
    AUTO_CALL_APPROVAL_REFERENCE: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      APS_ENVIRONMENT: development
      # Developer-reported official reply; private Sandbox integration testing only.
      AUTOMATION_APPROVED: YES
      AUTO_CALL_APPROVAL_REFERENCE: CASE_102982213153_OWNER_REPORTED_OFFICIAL_REPLY
    Release:
      APS_ENVIRONMENT: production
      AUTOMATION_APPROVED: NO
      AUTO_CALL_APPROVAL_REFERENCE: ""
packages:
  JiminCore:
    path: ../Core
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
targets:
  Jimin:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [ManualDemo-Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimin.mvp
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Jimin.entitlements
        DEVELOPMENT_TEAM: T79VA9MAUX
    dependencies:
      - package: JiminCore
      - package: WebRTC
      - target: JiminMonitor
        embed: true
  JiminMonitor:
    type: app-extension
    platform: iOS
    sources: [MonitorExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimin.mvp.monitor
        INFOPLIST_FILE: MonitorExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MonitorExtension/JiminMonitor.entitlements
        DEVELOPMENT_TEAM: T79VA9MAUX
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: JiminCore
  JiminManualDemo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ludia8888.headsup.jimin.manual
        INFOPLIST_FILE: App/ManualDemo-Info.plist
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG MANUAL_CALL_DEMO"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MANUAL_CALL_DEMO"
    dependencies:
      - package: JiminCore
      - package: WebRTC
schemes:
  Jimin:
    build:
      targets:
        Jimin: all
  JiminManualDemo:
    build:
      targets:
        JiminManualDemo: all
    run:
      config: Debug
