name: Jimin
options:
  bundleIdPrefix: com.jimin.mvp
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    AUTOMATION_APPROVED: NO
    AUTO_CALL_APPROVAL_REFERENCE: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
packages:
  JiminCore:
    path: ../Core
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
targets:
  Jimin:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimin.mvp
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Jimin.entitlements
    dependencies:
      - package: JiminCore
      - package: WebRTC
      - target: JiminMonitor
        embed: true
  JiminMonitor:
    type: app-extension
    platform: iOS
    sources: [MonitorExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimin.mvp.monitor
        INFOPLIST_FILE: MonitorExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MonitorExtension/JiminMonitor.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: JiminCore
schemes:
  Jimin:
    build:
      targets:
        Jimin: all
